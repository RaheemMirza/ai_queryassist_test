<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Generator — PS AM Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <nav class="topbar">
    <div class="topbar-brand"><span class="dot"></span> PS AM SQL Assistant</div>
    <div class="topbar-nav">
      <a href="/index.html" class="active">SQL Generator</a>
      <a href="/impact.html">Impact Analyzer</a>
      <a href="/saved.html">Saved Queries</a>
      <a href="/history.html">History</a>
    </div>
  </nav>

  <main class="page">
    <div class="page-header" style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px;">
      <div>
        <h1>SQL Generator</h1>
        <p>Chat with the assistant about your Asset Management data. This conversation is saved automatically.</p>
      </div>
      <button id="new-chat-btn" type="button" class="btn btn-secondary">New chat</button>
    </div>

    <div id="sample-chips" class="chip-row"></div>

    <div id="chat-thread" class="chat-thread"></div>

    <form id="chat-form" class="chat-input-bar">
      <textarea id="prompt-input" rows="1" placeholder="Ask a question, or just say hi…"></textarea>
      <button id="ask-btn" type="submit" class="btn btn-primary">
        <span id="ask-spinner" class="spinner hidden"></span>
        Send
      </button>
    </form>
  </main>

  <script src="/generate.js"></script>
</body>
</html>
